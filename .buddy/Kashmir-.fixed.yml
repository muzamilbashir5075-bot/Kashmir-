- pipeline: kashmir
  name: Kashmir
  refs:
  - refs/heads/main
  fail_on_prepare_env_warning: true
  events:
  - type: WEBHOOK
  arch: ARM64
  actions:
  - action: gradle build
    type: BUILD
    commands: gradle build
    shell: BASH
    docker_image_name: library/gradle
    docker_image_tag: "9.3"
